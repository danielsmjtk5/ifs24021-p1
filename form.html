<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Daftar Akun</title>
</head>
<body>
    <main>
        <!-- Navigasi Global -->
        <nav>
            <b>Navigasi:</b> 
            <a href="index.html">Film</a> | 
            <a href="blog.html">Blog List</a> | 
            <a href="blog-detail.html">Blog Detail</a> | 
            <a href="cv.html">CV</a> | 
            <a href="form.html">Form</a>
        </nav>
        <hr />

        <h1>Pendaftaran Akun Pengguna</h1>
        
        <form action="#" method="POST">
            <!-- Fieldset dan Legend murni HTML -->
            <fieldset>
                <legend>Daftar Akun</legend>

                <!-- Input validasi dengan proper label untuk Aksesibilitas (Clean Code) -->
                <label for="nama_lengkap">Nama Lengkap:</label> 
                <input type="text" name="nama_lengkap" id="nama_lengkap" required />
                <hr />

                Jenis Kelamin: 
                <input type="radio" name="jenis_kelamin" value="Laki-Laki" id="laki" /> <label for="laki">Laki-Laki</label>
                <input type="radio" name="jenis_kelamin" value="Perempuan" id="perempuan" /> <label for="perempuan">Perempuan</label>
                <hr />

                <label for="tempat_lahir">Tempat Lahir:</label> 
                <input type="text" name="tempat_lahir" id="tempat_lahir" />
                <hr />

                <label for="tanggal_lahir">Tanggal Lahir:</label> 
                <input type="date" name="tanggal_lahir" id="tanggal_lahir" />
                <hr />

                <label for="agama">Agama:</label> 
                <select name="agama" id="agama">
                    <option value="">--- Pilih Agama ---</option>
                    <option value="Islam">Islam</option>
                    <option value="Katolik">Katolik</option>
                    <option value="Protestan">Protestan</option>
                    <option value="Hindu">Hindu</option>
                    <option value="Buddha">Buddha</option>
                    <option value="Konghucu">Konghucu</option>
                </select>
                <hr />

                Hobi: 
                <input type="checkbox" name="hobi" value="Olahraga" id="olahraga" /> <label for="olahraga">Olahraga</label>
                <input type="checkbox" name="hobi" value="Membaca" id="membaca" /> <label for="membaca">Membaca</label>
                <input type="checkbox" name="hobi" value="Ngoding" id="ngoding" /> <label for="ngoding">Ngoding</label>
                <hr />

                <label for="password">Password:</label> 
                <input type="password" name="password" id="password" required />
                <hr />

                <input type="checkbox" name="persetujuan" id="setuju" required /> 
                <label for="setuju">Dengan mendaftar saya setuju dengan Ketentuan dan Kebijakan Privasi Aplikasi.</label>
                <hr />

                <!-- Type reset & submit sesuai best practice HTML -->
                <input type="reset" value="Reset" />
                <input type="submit" value="Submit" />

            </fieldset>
        </form>
    </main>
</body>
</html>
