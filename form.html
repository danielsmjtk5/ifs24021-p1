<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Form Daftar Akun</title>
</head>
<body>

    <!-- Form Pendaftaran -->
    <form action="#" method="POST">
        <!-- Fieldset untuk membungkus semua input -->
        <fieldset>
            <!-- Legend sebagai judul fieldset -->
            <legend>Daftar Akun</legend>

            Nama Lengkap: <input type="text" name="nama_lengkap" />
            <hr />

            Jenis Kelamin: 
            <input type="radio" name="jenis_kelamin" value="Laki-Laki" id="laki" /> <label for="laki">Laki-Laki</label>
            <input type="radio" name="jenis_kelamin" value="Perempuan" id="perempuan" /> <label for="perempuan">Perempuan</label>
            <hr />

            Tempat Lahir: <input type="text" name="tempat_lahir" />
            <hr />

            Tanggal Lahir: <input type="date" name="tanggal_lahir" />
            <hr />

            Agama: 
            <select name="agama">
                <option value="">--- Pilih Agama ---</option>
                <option value="Islam">Islam</option>
                <option value="Katolik">Katolik</option>
                <option value="Protestan">Protestan</option>
                <option value="Hindu">Hindu</option>
                <option value="Buddha">Buddha</option>
                <option value="Konghucu">Konghucu</option>
            </select>
            <hr />

            Hobi: 
            <input type="checkbox" name="hobi" value="Olahraga" id="olahraga" /> <label for="olahraga">Olahraga</label>
            <input type="checkbox" name="hobi" value="Membaca" id="membaca" /> <label for="membaca">Membaca</label>
            <input type="checkbox" name="hobi" value="Ngoding" id="ngoding" /> <label for="ngoding">Ngoding</label>
            <hr />

            Password: <input type="password" name="password" />
            <hr />

            <input type="checkbox" name="persetujuan" id="setuju" /> 
            <label for="setuju">Dengan mendaftar saya setuju dengan Ketentuan dan Kebijakan Privasi Aplikasi.</label>
            <hr />

            <!-- Tombol Reset dan Submit -->
            <input type="reset" value="Reset" />
            <input type="submit" value="Submit" />

        </fieldset>
    </form>

</body>
</html>
